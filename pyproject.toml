[project]
name = "pythonproject5"
version = "0.1.0"
description = "Bank operations widget"
authors = [
    {name = "Vadim", email = "fireguy0735@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "mypy>=1.10",
    "isort>=5.13",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["venv", ".venv"]
